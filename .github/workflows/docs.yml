name: Documentation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: DOCS_BASE=/ npm run check
