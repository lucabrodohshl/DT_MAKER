openapi: 3.1.0
info:
  title: Verified Twin Studio API
  version: 1.0.0
  summary: Platform and engineering-lifecycle API of twin-studio, served under /api/v1.
  description: |
    Machine-readable contract of `twin-studio` (src/studio/server.cpp, services_*.cpp).
    The product manual is docs/studio/README.md; the runtime API that Studio proxies is
    api/runtime.openapi.yaml.

    Conventions:
    - Every payload is a backend conclusion. Clients render it; they never derive
      behavioural or formal verdicts themselves.
    - Artefact versions are addressed as `<artifactId>@<version>` (for example
      `process-pump@1`).
    - Times are ISO 8601 UTC strings (`...Z`). Telemetry also carries epoch milliseconds.
    - POST bodies must be JSON objects (send `{}` when empty). Requests that change state
      should carry `X-Twin-Actor`, which attributes the change in the engineering audit
      (attribution only, not authentication).
    - Errors use the `Error` schema. Status codes: 400 invalid argument / parse error,
      404 not found, 409 lifecycle state or integrity conflict, 422 rejected by validation
      or by the kernel, 503 upstream runtime unavailable, 500 internal error.

    Maintenance: the paths below are hand-written. `components.schemas` below the
    "generated" marker is produced from web/studio/src/api/types.ts by
    `python3 scripts/openapi/studio_components.py` (`--check` fails on drift), and
    `python3 scripts/openapi/check_studio_contract.py` validates live responses of a
    running twin-studio against this document.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: local demo (scripts/start-demo.sh)
tags:
  - name: system
  - name: assets
  - name: telemetry
  - name: twins
  - name: artifacts
  - name: checks
  - name: evidence
  - name: changes
  - name: packages
  - name: deployments
  - name: audit
  - name: stream
  - name: proxy
  - name: blueprints
  - name: instances

paths:
  /about:
    get:
      tags: [system]
      summary: Product, compiler, kernel, aligner and checker identities.
      operationId: getAbout
      responses:
        '200': { description: Identities, content: { application/json: { schema: { $ref: '#/components/schemas/About' } } } }
  /overview:
    get:
      tags: [system]
      summary: Estate overview (assets, telemetry freshness, twins and trust, engineering activity).
      operationId: getOverview
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } } }
  /search:
    get:
      tags: [system]
      summary: Global search over assets, twins, symbols, versions, evidence, packages, deployments and changes.
      operationId: search
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { $ref: '#/components/schemas/SearchResult' } } } }
  /logs:
    get:
      tags: [system]
      summary: Diagnostic application log (not evidence; secrets redacted).
      operationId: getLogs
      parameters:
        - { name: level, in: query, schema: { enum: [debug, info, warn, error] }, description: Minimum level }
        - { name: component, in: query, schema: { type: string }, description: Component prefix }
        - { name: correlation, in: query, schema: { type: string } }
        - { name: execution, in: query, schema: { type: string } }
        - { name: asset, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: Message substring }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 200 } }
      responses:
        '200': { description: Entries, newest first, content: { application/json: { schema: { $ref: '#/components/schemas/LogPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /assets:
    get:
      tags: [assets]
      summary: Assets (paged).
      operationId: listAssets
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: parent, in: query, schema: { type: string }, description: Children of this asset (empty for roots) }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Page of assets, content: { application/json: { schema: { $ref: '#/components/schemas/AssetPage' } } } }
  /assets/{assetId}:
    parameters: [{ $ref: '#/components/parameters/assetId' }]
    get:
      tags: [assets]
      summary: Asset with ancestors, children, relationships and its (possibly inherited) twin.
      operationId: getAsset
      responses:
        '200': { description: Asset, content: { application/json: { schema: { $ref: '#/components/schemas/AssetDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /assets/{assetId}/neighborhood:
    parameters: [{ $ref: '#/components/parameters/assetId' }]
    get:
      tags: [assets]
      summary: Knowledge-graph neighbourhood around an asset (bounded; never the whole estate).
      operationId: getNeighborhood
      parameters:
        - { name: depth, in: query, schema: { type: integer, minimum: 0, default: 1 } }
        - { name: types, in: query, schema: { type: string }, description: Comma-separated relationship types }
        - { name: max, in: query, schema: { type: integer }, description: Node cap; `truncated` reports when it was hit }
      responses:
        '200': { description: Neighbourhood, content: { application/json: { schema: { $ref: '#/components/schemas/Neighborhood' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /graph/facets:
    get:
      tags: [assets]
      summary: Relationship and asset types with counts, and the hierarchy roots.
      operationId: getGraphFacets
      responses:
        '200': { description: Facets, content: { application/json: { schema: { $ref: '#/components/schemas/GraphFacets' } } } }

  /assets/{assetId}/telemetry:
    parameters: [{ $ref: '#/components/parameters/assetId' }]
    get:
      tags: [telemetry]
      summary: Telemetry channels of an asset with latest sample and freshness.
      operationId: getAssetTelemetry
      parameters:
        - { name: descendants, in: query, schema: { type: boolean }, description: Include channels of descendant assets }
      responses:
        '200': { description: Channels, content: { application/json: { schema: { $ref: '#/components/schemas/TelemetryChannels' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /telemetry/{channelId}/series:
    parameters: [{ name: channelId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [telemetry]
      summary: Historical samples; downsampled server-side to buckets (min/max/avg/quality counts) when dense.
      operationId: getSeries
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: maxPoints, in: query, schema: { type: integer } }
      responses:
        '200': { description: Series, content: { application/json: { schema: { $ref: '#/components/schemas/TelemetrySeries' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /telemetry/ingest:
    post:
      tags: [telemetry]
      summary: Ingest observations (observation time from the source; ingestion time is stamped by Studio).
      operationId: ingestTelemetry
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IngestSample' } } } }
      responses:
        '200': { description: Ingested, content: { application/json: { schema: { $ref: '#/components/schemas/IngestResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /twins:
    get:
      tags: [twins]
      summary: Registered twins with their current deployment.
      operationId: listTwins
      responses:
        '200': { description: Twins, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/TwinSummary' } } } } }
  /twins/{twinId}:
    parameters: [{ $ref: '#/components/parameters/twinId' }]
    get:
      tags: [twins]
      summary: Twin with deployed package, bound artefact versions and trust summary (computed from evidence on every request).
      operationId: getTwin
      responses:
        '200': { description: Twin, content: { application/json: { schema: { $ref: '#/components/schemas/TwinDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /twins/{twinId}/{family}/{path}:
    parameters:
      - { $ref: '#/components/parameters/twinId' }
      - { name: family, in: path, required: true, schema: { enum: [runtime, simulation, planner, world, mission, observer, scenario] } }
      - { name: path, in: path, required: true, schema: { type: string }, description: Remainder of the runtime route (may contain slashes) }
    get:
      tags: [proxy]
      summary: Proxy to the twin's runtime (observer/scenario go to the world simulator). See api/runtime.openapi.yaml.
      operationId: proxyGet
      responses:
        '200': { description: Upstream response, unchanged }
        '503': { $ref: '#/components/responses/Unavailable' }
    post:
      tags: [proxy]
      summary: Proxy to the twin's runtime. See api/runtime.openapi.yaml.
      operationId: proxyPost
      responses:
        '200': { description: Upstream response, unchanged }
        '503': { $ref: '#/components/responses/Unavailable' }

  /artifacts:
    get:
      tags: [artifacts]
      summary: Artefacts with their latest, published and open versions.
      operationId: listArtifacts
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/ArtifactKind' } }
      responses:
        '200': { description: Artefacts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ArtifactSummary' } } } } }
    post:
      tags: [artifacts]
      summary: Create an artefact with its first (draft) version.
      operationId: createArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, id, name, content]
              properties:
                kind: { $ref: '#/components/schemas/ArtifactKind' }
                id: { type: string }
                name: { type: string }
                description: { type: string }
                content: { type: string }
                refs: { type: object, additionalProperties: { type: string }, description: 'e.g. {"ontology": "process-pump@1"} for an interpretation' }
      responses:
        '200': { description: Created version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}:
    parameters: [{ $ref: '#/components/parameters/artifactId' }]
    get:
      tags: [artifacts]
      summary: Artefact with all versions, interpretations over it and deployments using it.
      operationId: getArtifact
      responses:
        '200': { description: Artefact, content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts/{artifactId}/versions/{version}:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    get:
      tags: [artifacts]
      summary: Version with content, parsed structure, strict-parser diagnostics and latest validation.
      operationId: getVersion
      responses:
        '200': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [artifacts]
      summary: Save a draft. Never validates, publishes or deploys. A content change returns a VERIFIED draft to DRAFT.
      operationId: saveDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                refs: { type: object, additionalProperties: { type: string } }
                changeDescription: { type: string }
      responses:
        '200': { description: Saved version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}/versions/{version}/drafts:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    post:
      tags: [artifacts]
      summary: Create a new draft whose parent is this version (one open draft per artefact).
      operationId: createDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string }
                changeId: { type: string, description: Attach the draft to this change workspace }
      responses:
        '200': { description: New draft, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}/versions/{version}/validate:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    post:
      tags: [checks]
      summary: Validate (strict parser, aligner parser cross-check, Z3 consistency); stores validation evidence; DRAFT → VERIFIED on success.
      operationId: validateVersion
      responses:
        '200': { description: Validated version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}/versions/{version}/publish:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    post:
      tags: [artifacts]
      summary: Publish a VERIFIED version (immutable from then on). 409 for any other state.
      operationId: publishVersion
      responses:
        '200': { description: Published version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}/versions/{version}/reject:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    post:
      tags: [artifacts]
      summary: Reject an unpublished version (kept for the record; evidence on it becomes INVALIDATED).
      operationId: rejectVersion
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } } } }
      responses:
        '200': { description: Rejected version, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /artifacts/{artifactId}/versions/{version}/symbols/{symbol}:
    parameters:
      - { $ref: '#/components/parameters/artifactId' }
      - { $ref: '#/components/parameters/version' }
      - { name: symbol, in: path, required: true, schema: { type: string } }
    get:
      tags: [artifacts]
      summary: Declaration of an ontology symbol, axioms using it, interpretation entries using it and channels observing it.
      operationId: getSymbol
      responses:
        '200': { description: Symbol, content: { application/json: { schema: { $ref: '#/components/schemas/SymbolInfo' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts/{artifactId}/versions/{version}/evaluate:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    post:
      tags: [checks]
      summary: Evaluate an interpretation (three-valued, Z3) against given observations and/or an asset's latest telemetry.
      operationId: evaluateInterpretation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observations: { type: object, additionalProperties: { type: [string, boolean] }, description: Symbol → exact decimal string or boolean }
                assetId: { type: string, description: Use this asset's latest telemetry for observed symbols }
                keys: { type: array, items: { type: string }, description: Only these entries }
      responses:
        '200': { description: Evaluation, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluationResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /artifacts/{artifactId}/versions/{version}/impact:
    parameters: [{ $ref: '#/components/parameters/artifactId' }, { $ref: '#/components/parameters/version' }]
    get:
      tags: [checks]
      summary: Impact of this version replacing what each twin deploys (classifications with evidence-based reasons).
      operationId: getImpact
      responses:
        '200': { description: Impact report, content: { application/json: { schema: { $ref: '#/components/schemas/ImpactReport' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /artifacts-impact:
    get:
      tags: [checks]
      summary: Same as /artifacts/{id}/versions/{v}/impact, addressed by reference.
      operationId: getImpactByRef
      parameters: [{ name: ref, in: query, required: true, schema: { type: string, examples: [process-pump@3] } }]
      responses:
        '200': { description: Impact report, content: { application/json: { schema: { $ref: '#/components/schemas/ImpactReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /diff:
    get:
      tags: [artifacts]
      summary: Structural (semantic) and source diff between two versions of an artefact, with affected interpretation entries.
      operationId: getDiff
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Diff, content: { application/json: { schema: { $ref: '#/components/schemas/DiffResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /refinement-checks:
    post:
      tags: [checks]
      summary: Run the Definition 4 refinement check (candidate ⊑ base); stores refinement evidence.
      description: |
        The verdict is one of valid_refinement, not_a_refinement, unknown, check_failed.
        Invalid input and checker failures are check_failed, never not_a_refinement.
        Condition (c) is evaluated only when the base interpretations are given.
      operationId: runRefinementCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base, candidate]
              properties:
                base: { $ref: '#/components/schemas/RefinementSide' }
                candidate: { $ref: '#/components/schemas/RefinementSide' }
                changeId: { type: string }
      responses:
        '200': { description: Refinement evidence (document is a RefinementDocument), content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceRecord' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /evidence:
    get:
      tags: [evidence]
      summary: Verification history (never overwritten), newest first.
      operationId: listEvidence
      parameters:
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/EvidenceKind' } }
        - { name: artifact, in: query, schema: { type: string } }
        - { name: version, in: query, schema: { type: integer } }
        - { name: change, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Page of evidence, content: { application/json: { schema: { $ref: '#/components/schemas/EvidencePage' } } } }
  /evidence/{evidenceId}:
    parameters: [{ $ref: '#/components/parameters/evidenceId' }]
    get:
      tags: [evidence]
      summary: Evidence record with its full document; documentIntegrity re-verifies the stored hash.
      operationId: getEvidence
      responses:
        '200': { description: Evidence, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceRecord' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /evidence/{evidenceId}/status:
    parameters: [{ $ref: '#/components/parameters/evidenceId' }]
    get:
      tags: [evidence]
      summary: Applicability (VALID / STALE / INVALIDATED / UNKNOWN) for a twin's deployment or a change's candidates, with the structured "why".
      description: Exactly one of `twin` or `change` is required (400 otherwise).
      operationId: getEvidenceStatus
      parameters:
        - { name: twin, in: query, schema: { type: string }, description: Judge against this twin's current deployment }
        - { name: change, in: query, schema: { type: string }, description: Judge against this change's candidate artefacts }
      responses:
        '200': { description: Applicability, content: { application/json: { schema: { $ref: '#/components/schemas/ApplicabilityReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /changes:
    get:
      tags: [changes]
      summary: Change workspaces.
      operationId: listChanges
      parameters: [{ name: state, in: query, schema: { enum: [open, released, abandoned] } }]
      responses:
        '200': { description: Changes, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Change' } } } } }
    post:
      tags: [changes]
      summary: Open a change workspace for a twin.
      operationId: createChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [twinId, title], properties: { twinId: { type: string }, title: { type: string }, description: { type: string } } }
      responses:
        '200': { description: Change, content: { application/json: { schema: { $ref: '#/components/schemas/Change' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /changes/{changeId}:
    parameters: [{ $ref: '#/components/parameters/changeId' }]
    get:
      tags: [changes]
      summary: Change with its artefact versions and twin.
      operationId: getChange
      responses:
        '200': { description: Change, content: { application/json: { schema: { $ref: '#/components/schemas/Change' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /changes/{changeId}/artifacts:
    parameters: [{ $ref: '#/components/parameters/changeId' }]
    post:
      tags: [changes]
      summary: Add an artefact to the change (creates a draft from the version the twin deploys).
      operationId: addChangeArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [artifactId], properties: { artifactId: { type: string }, description: { type: string } } }
      responses:
        '200': { description: New draft, content: { application/json: { schema: { $ref: '#/components/schemas/VersionDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes/{changeId}/pipeline:
    parameters: [{ $ref: '#/components/parameters/changeId' }]
    get:
      tags: [changes]
      summary: Release pipeline computed from stored evidence for exactly the candidate artefacts.
      operationId: getPipeline
      responses:
        '200': { description: Pipeline, content: { application/json: { schema: { $ref: '#/components/schemas/Pipeline' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /changes/{changeId}/stages/{stage}/run:
    parameters:
      - { $ref: '#/components/parameters/changeId' }
      - { name: stage, in: path, required: true, schema: { enum: [validate, refinement, alignment, compile, package, verify] } }
    post:
      tags: [changes]
      summary: Run one pipeline stage through the real backend (aligner, compiler, package builder/verifier).
      operationId: runStage
      responses:
        '200': { description: Stage result (shape depends on the stage; evidence or package integrity) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes/{changeId}/release:
    parameters: [{ $ref: '#/components/parameters/changeId' }]
    post:
      tags: [changes]
      summary: Release (publishes every VERIFIED version, marks the package released, closes the change). 409 lists the blocking stages.
      operationId: releaseChange
      responses:
        '200': { description: Released, content: { application/json: { schema: { $ref: '#/components/schemas/ReleaseResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /changes/{changeId}/abandon:
    parameters: [{ $ref: '#/components/parameters/changeId' }]
    post:
      tags: [changes]
      summary: Abandon a change (reason required).
      operationId: abandonChange
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 1 } } } } }
      responses:
        '200': { description: Change, content: { application/json: { schema: { $ref: '#/components/schemas/Change' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }

  /packages:
    get:
      tags: [packages]
      summary: Verified packages (immutable once built).
      operationId: listPackages
      parameters: [{ name: twin, in: query, schema: { type: string } }]
      responses:
        '200': { description: Packages, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PackageRecord' } } } } }
  /packages/{packageId}:
    parameters: [{ $ref: '#/components/parameters/packageId' }]
    get:
      tags: [packages]
      summary: Package with bound versions, build evidence, integrity and deployments.
      operationId: getPackage
      responses:
        '200': { description: Package, content: { application/json: { schema: { $ref: '#/components/schemas/PackageDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /packages/{packageId}/ir:
    parameters: [{ $ref: '#/components/parameters/packageId' }]
    get:
      tags: [packages]
      summary: The package's Twin IR (same format as the runtime's GET /runtime/model).
      operationId: getPackageIr
      responses:
        '200': { description: Twin IR, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /packages/{packageId}/verify:
    parameters: [{ $ref: '#/components/parameters/packageId' }]
    post:
      tags: [packages]
      summary: Verify package integrity now (every content hash, manifest and package hash).
      operationId: verifyPackage
      responses:
        '200': { description: Integrity, content: { application/json: { schema: { $ref: '#/components/schemas/PackageIntegrity' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /deployments:
    get:
      tags: [deployments]
      summary: Append-only deployment history, newest first.
      operationId: listDeployments
      parameters: [{ name: twin, in: query, schema: { type: string } }]
      responses:
        '200': { description: Deployments, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Deployment' } } } } }
    post:
      tags: [deployments]
      summary: Deploy a package to a twin (integrity is verified first; a failing package is refused).
      operationId: deploy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentRequest' } } }
      responses:
        '200': { description: Deployment, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deployments/rollback-preview:
    get:
      tags: [deployments]
      summary: What a rollback to a package would change, with the target's evidence and fresh integrity.
      operationId: rollbackPreview
      parameters:
        - { name: twin, in: query, required: true, schema: { type: string } }
        - { name: package, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/RollbackPreview' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /deployments/rollback:
    post:
      tags: [deployments]
      summary: Roll back to a previously released package (reason required; nothing newer is deleted).
      operationId: rollback
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DeploymentRequest' } } }
      responses:
        '200': { description: Deployment of kind rollback, content: { application/json: { schema: { $ref: '#/components/schemas/Deployment' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /blueprints:
    get:
      tags: [blueprints]
      summary: Twin Blueprints with their versions, draft readiness hint and instance count.
      operationId: listBlueprints
      responses:
        '200': { description: Blueprints, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlueprintListItem' } } } } }
    post:
      tags: [blueprints]
      summary: Create a Blueprint (mode blank, template, clone, import, formal or document); its first version is a DRAFT.
      description: |
        Formal files are imported into the canonical forms on the server; a model with constructs
        outside the supported fragment is reported in `imports` and leaves its role empty.
      operationId: createBlueprint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [blank, template, clone, import, formal, document] }
                id: { type: string, pattern: '^[a-z0-9][a-z0-9-]*$' }
                name: { type: string }
                domain: { type: string }
                description: { type: string }
                icon: { type: string }
                identity: { type: object, description: 'runtimeMode, timeUnit, ticksPerUnit, tags, plugin, icon' }
                templateId: { type: string }
                from: { type: string, description: Blueprint to clone }
                version: { type: integer, description: Version to clone }
                bundle: { type: object, description: 'twin-blueprint-bundle/1 (mode import)' }
                ptModel: { $ref: '#/components/schemas/FormalFile' }
                dtModel: { $ref: '#/components/schemas/FormalFile' }
                ontology: { $ref: '#/components/schemas/FormalFile' }
                ptInterpretation: { $ref: '#/components/schemas/FormalFile' }
                dtInterpretation: { $ref: '#/components/schemas/FormalFile' }
      responses:
        '200': { description: First version, the Blueprint and the import report, content: { application/json: { schema: { type: object } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/templates:
    get:
      tags: [blueprints]
      summary: Installed Blueprint templates.
      operationId: listBlueprintTemplates
      responses:
        '200': { description: Templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BlueprintTemplate' } } } } }
  /blueprints/palettes:
    get:
      tags: [blueprints]
      summary: World-editor tool palettes per domain.
      operationId: getBlueprintPalettes
      responses:
        '200': { description: Palettes, content: { application/json: { schema: { $ref: '#/components/schemas/Palettes' } } } }
  /blueprints/{blueprintId}:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }]
    get:
      tags: [blueprints]
      summary: Blueprint with all versions and its instances.
      operationId: getBlueprint
      responses:
        '200': { description: Blueprint, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [blueprints]
      summary: Update the Blueprint's name, description, domain or icon.
      operationId: updateBlueprint
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Blueprint, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintListItem' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /blueprints/{blueprintId}/versions/{bpVersion}:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: Version document, pins, revision (drafts) and whether it is editable.
      operationId: getBlueprintVersion
      responses:
        '200': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintVersionDetail' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /blueprints/{blueprintId}/versions/{bpVersion}/drafts:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    post:
      tags: [blueprints]
      summary: Create the next draft from this version (one draft per Blueprint).
      operationId: createBlueprintDraft
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses:
        '200': { description: Draft, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintVersionSummary' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/sections/{section}:
    parameters:
      - { $ref: '#/components/parameters/blueprintId' }
      - { $ref: '#/components/parameters/bpVersion' }
      - { name: section, in: path, required: true, schema: { type: string, enum: [identity, structure, world, data, connectivity, presentation, behavior, assurance, simulation, scenarios] } }
    put:
      tags: [blueprints]
      summary: Save one section of a draft (optimistic concurrency on `revision`; 409 when stale). Returns the section's findings.
      operationId: saveBlueprintSection
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [revision, content], properties: { revision: { type: integer }, content: {} } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SectionSaveResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/models/{viewRole}:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }, { $ref: '#/components/parameters/viewRole' }]
    get:
      tags: [blueprints]
      summary: The PT or DT view as a canonical timed automaton (twin-ta/1), its layout and structural diagnostics.
      operationId: getBlueprintModel
      responses:
        '200': { description: Model, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintModelView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [blueprints]
      summary: Save the view (twin-ta/1) and its layout into the draft's editable artefact version.
      operationId: saveBlueprintModel
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision, model], properties: { revision: { type: integer }, model: { $ref: '#/components/schemas/TaModel' }, layout: {} } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/ModelSaveResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/models/{viewRole}/import:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }, { $ref: '#/components/parameters/viewRole' }]
    post:
      tags: [blueprints]
      summary: Import a view (UPPAAL XML, twin-ta/1 JSON or TwinTA text); unsupported constructs are reported, never approximated.
      operationId: importBlueprintModel
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision, filename, content], properties: { revision: { type: integer }, filename: { type: string }, content: { type: string } } } } } }
      responses:
        '200': { description: Import report, content: { application/json: { schema: { $ref: '#/components/schemas/ModelImportResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/semantics/{semanticRole}:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }, { $ref: '#/components/parameters/semanticRole' }]
    get:
      tags: [blueprints]
      summary: Ontology or interpretation pinned by the version, with parsed structure, diagnostics and coverage.
      operationId: getBlueprintSemantics
      responses:
        '200': { description: Semantics, content: { application/json: { schema: { $ref: '#/components/schemas/SemanticsView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [blueprints]
      summary: Save the text into the draft's editable version, or pin an existing version (`ref`). An interpretation needs the ontology first.
      operationId: saveBlueprintSemantics
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision], properties: { revision: { type: integer }, content: { type: string }, ref: { type: string } } } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/SemanticsView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/validation:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: Findings of every section (structure, world, data, connectivity, assurance, scenarios...).
      operationId: getBlueprintValidation
      responses:
        '200': { description: Findings, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintValidation' } } } }
  /blueprints/{blueprintId}/versions/{bpVersion}/status:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: Section states, completeness and the release gate, from evidence for exactly the pinned inputs.
      operationId: getBlueprintStatus
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintStatus' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /blueprints/{blueprintId}/versions/{bpVersion}/checks/{check}:
    parameters:
      - { $ref: '#/components/parameters/blueprintId' }
      - { $ref: '#/components/parameters/bpVersion' }
      - { name: check, in: path, required: true, schema: { type: string, enum: [formal, alignment, compile, refinement, scenarios, package] } }
    post:
      tags: [checks]
      summary: Run a check on the version's pinned inputs and record its evidence (package also builds the Deployment Bundle; it requires every other gate item to pass).
      operationId: runBlueprintCheck
      responses:
        '200': { description: Check result (evidence), content: { application/json: { schema: { $ref: '#/components/schemas/CheckResult' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/world/raster:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: Simulator grids rasterised from the world (ground truth and the twin's initial knowledge).
      operationId: getBlueprintWorldRaster
      responses:
        '200': { description: Grids, content: { application/json: { schema: { $ref: '#/components/schemas/WorldRaster' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/timing:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    post:
      tags: [checks]
      summary: Kernel what-if on the compiled Digital Twin View — availability (now / later / blocked) with every legal interval, explanations and refusals.
      description: |
        Body: a what-if request (`start`, `steps`) or `scenarioSteps` (the steps of a Blueprint
        scenario; world observations generate their mapped events, expectations let time pass;
        `origins` names each formal step's source). Plant (PT) events are translated through the
        label equivalence of the alignment evidence for exactly these inputs.
      operationId: blueprintTiming
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Timing, content: { application/json: { schema: { $ref: '#/components/schemas/TimingResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /blueprints/{blueprintId}/versions/{bpVersion}/scenarios/{scenarioId}/run:
    parameters:
      - { $ref: '#/components/parameters/blueprintId' }
      - { $ref: '#/components/parameters/bpVersion' }
      - { name: scenarioId, in: path, required: true, schema: { type: string } }
    post:
      tags: [checks]
      summary: Run one scenario as a test on the kernel (tests of example runs, not proofs).
      operationId: runBlueprintScenario
      responses:
        '200': { description: Results, content: { application/json: { schema: { $ref: '#/components/schemas/ScenarioRun' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /blueprints/{blueprintId}/versions/{bpVersion}/impact:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: What changed against another version (default the parent) and what must be re-run or rebuilt.
      operationId: getBlueprintImpact
      parameters: [{ name: against, in: query, schema: { type: integer } }]
      responses:
        '200': { description: Impact, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintImpact' } } } }
  /blueprints/{blueprintId}/versions/{bpVersion}/package:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [packages]
      summary: Verified Core Package and Deployment Bundle of the version (with what would be packaged before a build).
      operationId: getBlueprintPackage
      responses:
        '200': { description: Package view, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintPackageView' } } } }
  /blueprints/{blueprintId}/versions/{bpVersion}/publish:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    post:
      tags: [blueprints]
      summary: Publish the draft (refused with the blockers while the release gate does not pass).
      operationId: publishBlueprint
      responses:
        '200': { description: Published version, content: { application/json: { schema: { $ref: '#/components/schemas/BlueprintVersionSummary' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /blueprints/{blueprintId}/versions/{bpVersion}/export:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: Export the version as a twin-blueprint-bundle/1 document (sections and formal artefacts).
      operationId: exportBlueprint
      responses:
        '200': { description: Bundle, content: { application/json: { schema: { type: object } } } }
  /blueprints/{blueprintId}/versions/{bpVersion}/bindings/test:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    post:
      tags: [blueprints]
      summary: Test a data binding against its source (one read; nothing is stored).
      operationId: testBlueprintBinding
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/BindingTestResult' } } } }
  /blueprints/{blueprintId}/versions/{bpVersion}/preview:
    parameters: [{ $ref: '#/components/parameters/blueprintId' }, { $ref: '#/components/parameters/bpVersion' }]
    get:
      tags: [blueprints]
      summary: State of the version's isolated Studio preview.
      operationId: getBlueprintPreview
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewView' } } } }
    post:
      tags: [blueprints]
      summary: Start the isolated STUDIO PREVIEW (no twin record, deployment or stored telemetry); its runtime is reachable through the twin proxy under previewId.
      operationId: startBlueprintPreview
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { speed: { type: string }, paused: { type: boolean }, simulator: { type: boolean } } } } } }
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewView' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [blueprints]
      summary: Stop the preview (idempotent).
      operationId: stopBlueprintPreview
      responses:
        '200': { description: Preview, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewView' } } } }

  /instances:
    get:
      tags: [instances]
      summary: Twin instances (optionally of one Blueprint) with their supervised runtime state.
      operationId: listInstances
      parameters: [{ name: blueprint, in: query, schema: { type: string } }]
      responses:
        '200': { description: Instances, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/InstanceView' } } } } }
    post:
      tags: [instances]
      summary: Create an instance from a published Blueprint version (assets, identity, placement, target).
      operationId: createInstance
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [blueprintId, version, id] } } } }
      responses:
        '200': { description: Instance, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceView' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /instances/{instanceId}:
    parameters: [{ $ref: '#/components/parameters/instanceId' }]
    get:
      tags: [instances]
      summary: One instance with its runtime state and whether a newer published version exists.
      operationId: getInstance
      responses:
        '200': { description: Instance, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /instances/{instanceId}/monitors:
    parameters: [{ $ref: '#/components/parameters/instanceId' }]
    get:
      tags: [instances]
      summary: Live monitor results, active alerts and requirement status (each monitor evaluated by its authority; unknown when it cannot be).
      operationId: getInstanceMonitors
      responses:
        '200': { description: Monitors, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceMonitorsView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /instances/{instanceId}/deploy:
    parameters: [{ $ref: '#/components/parameters/instanceId' }]
    post:
      tags: [deployments]
      summary: Deploy (or upgrade / roll back to `version`) under the deployment supervisor.
      operationId: deployInstance
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { version: { type: integer }, reason: { type: string } } } } } }
      responses:
        '200': { description: Deployment, content: { application/json: { schema: { type: object } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /instances/{instanceId}/{action}:
    parameters:
      - { $ref: '#/components/parameters/instanceId' }
      - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop] } }
    post:
      tags: [deployments]
      summary: Start or stop a deployed instance (its desired state).
      operationId: controlInstance
      responses:
        '200': { description: Instance, content: { application/json: { schema: { $ref: '#/components/schemas/InstanceView' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /supervisor:
    get:
      tags: [deployments]
      summary: Deployment supervisor availability and every supervised instance and preview.
      operationId: getSupervisor
      responses:
        '200': { description: Supervisor, content: { application/json: { schema: { type: object, required: [available, instances], properties: { available: { type: boolean }, binDir: { type: string }, instances: { type: array, items: { $ref: '#/components/schemas/SupervisorStatus' } } } } } } }
  /blobs:
    post:
      tags: [blueprints]
      summary: Store a content-addressed blob (world background images) and return its URL.
      operationId: uploadBlob
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mime, data], properties: { mime: { type: string }, data: { type: string, description: base64 } } } } } }
      responses:
        '200': { description: Blob, content: { application/json: { schema: { type: object, required: [sha256, url], properties: { sha256: { type: string }, url: { type: string }, mime: { type: string }, size: { type: integer } } } } } }

  /audit:
    get:
      tags: [audit]
      summary: Engineering audit trail (hash-chained), newest first.
      operationId: listAudit
      parameters:
        - { name: operation, in: query, schema: { type: string }, description: 'e.g. artifact.publish, refinement.run, deployment.rollback' }
        - { name: subject, in: query, schema: { type: string } }
        - { name: actor, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200': { description: Page of records, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } } }
  /audit/verify:
    post:
      tags: [audit]
      summary: Recompute the engineering audit chain; reports the first invalid record.
      operationId: verifyAudit
      responses:
        '200': { description: Verification, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }

  /stream:
    get:
      tags: [stream]
      summary: Server-Sent Events of platform changes.
      description: |
        Events: `hello` ({epoch, head}) on connect; then topic events `artifact`, `evidence`,
        `telemetry`, `change`, `package`, `deployment`, each with `id` = seq and data
        {seq, topic, at, data}. A `resync` event (buffer overrun) or a different `epoch`
        (server restart) means the client must refetch authoritative state. Resume with the
        `Last-Event-ID` header or `?lastEventId=`.
      operationId: stream
      parameters:
        - { name: lastEventId, in: query, schema: { type: integer } }
        - { name: Last-Event-ID, in: header, schema: { type: integer } }
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/StreamEvent' }

components:
  parameters:
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1 } }
